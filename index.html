<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosquito VR Thermal Vision Experience</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* HUD Overlay Info */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffaa;
      font-family: monospace;
      text-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
      pointer-events: none;
      z-index: 10;
      background: rgba(0, 15, 10, 0.6);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 170, 0.3);
      max-width: 320px;
    }
    #ui-overlay h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }
    #ui-overlay p {
      font-size: 0.8rem;
      color: #88ccbb;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .hud-stat {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .hud-label {
      color: #66aaaa;
    }
    .hud-value {
      font-weight: bold;
      color: #ffcc00;
    }

    /* VR BUTTON OVERRIDE STYLING */
    #VRButton {
      position: absolute !important;
      bottom: 25px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      padding: 12px 24px !important;
      border: 2px solid #00ffaa !important;
      border-radius: 30px !important;
      background: rgba(0, 30, 20, 0.85) !important;
      color: #00ffaa !important;
      font-family: monospace !important;
      font-size: 14px !important;
      font-weight: bold !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.4) !important;
      transition: all 0.2s ease !important;
      z-index: 1000 !important;
    }
    #VRButton:hover {
      background: #00ffaa !important;
      color: #000000 !important;
      box-shadow: 0 0 25px rgba(0, 255, 170, 0.8) !important;
    }
  </style>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Overlay Info -->
  <div id="ui-overlay">
    <h1>Mosquito Vision VR</h1>
    <p>Target heat sources (pulsing blood vessels) to feed. Put on your Meta Quest headset and tap <b>ENTER VR</b>.</p>
    <div class="hud-stat">
      <span class="hud-label">Vision Mode:</span>
      <span class="hud-value" id="vision-mode-text">Thermal Infrared</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Proximity Heat:</span>
      <span class="hud-value" id="heat-sense-text">0%</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Flight System:</span>
      <span class="hud-value">Quest Thumbstick / WASD</span>
    </div>
  </div>

  <script>
    /**
     * SELF-CONTAINED VR BUTTON HELPER (Prevents CDN loading race conditions)
     */
    const CustomVRButton = {
      createButton: function (renderer) {
        const button = document.createElement('button');
        button.id = 'VRButton';

        function showEnterVR() {
          let currentSession = null;

          async function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            await renderer.xr.setSession(session);
            button.textContent = 'EXIT VR';
            currentSession = session;
          }

          function onSessionEnded() {
            currentSession.removeEventListener('end', onSessionEnded);
            button.textContent = 'ENTER VR';
            currentSession = null;
          }

          button.style.display = '';
          button.style.cursor = 'pointer';
          button.textContent = 'ENTER VR';

          button.onmouseenter = function () {
            button.style.opacity = '1.0';
          };
          button.onmouseleave = function () {
            button.style.opacity = '0.9';
          };

          button.onclick = function () {
            if (currentSession === null) {
              const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
              navigator.xr.requestSession('immersive-vr', sessionInit).then(onSessionStarted);
            } else {
              currentSession.end();
            }
          };
        }

        function disableButton() {
          button.style.display = '';
          button.style.cursor = 'auto';
          button.style.opacity = '0.5';
          button.onmouseenter = null;
          button.onmouseleave = null;
          button.onclick = null;
        }

        function showVRNotSupported() {
          disableButton();
          button.textContent = 'VR NOT SUPPORTED';
        }

        function showVRNotAllowed(exception) {
          disableButton();
          console.warn('Exception when requesting VR session', exception);
          button.textContent = 'VR NOT ALLOWED (Requires HTTPS)';
        }

        if ('xr' in navigator) {
          button.id = 'VRButton';
          button.style.display = 'none';

          navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
            supported ? showEnterVR() : showVRNotSupported();
          }).catch(showVRNotAllowed);

          return button;
        } else {
          const message = document.createElement('a');
          if (window.isSecureContext === false) {
            message.href = document.location.href.replace(/^http:/, 'https:');
            message.innerHTML = 'WEBXR NEEDS HTTPS';
          } else {
            message.href = 'https://immersiveweb.dev/';
            message.innerHTML = 'WEBXR NOT AVAILABLE';
          }
          message.style.left = 'calc(50% - 90px)';
          message.style.width = '180px';
          message.style.textDecoration = 'none';

          button.id = 'VRButton';
          button.textContent = message.innerHTML;
          button.onclick = () => {
            if (window.isSecureContext === false) {
              window.location.href = message.href;
            }
          };
          return button;
        }
      }
    };

    /**
     * THREE.JS MOSQUITO VR EXPERIMENTAL ENGINE
     */
    let scene, camera, renderer, cameraGroup;
    let renderTarget, postScene, postCamera, thermalShaderMaterial;
    let controllers = [];
    let targetVessels = [];
    let clock = new THREE.Clock();

    // Flight Dynamics State
    const playerVelocity = new THREE.Vector3();
    const flightSpeed = 1.8;
    const drag = 0.92;

    // Element References
    const heatSenseText = document.getElementById('heat-sense-text');

    // --- INITIALIZATION ---
    init();
    setupThermalPostProcessing();
    buildMosquitoWorld();
    setupVRControllers();
    setupKeyboardFallback();

    // Start WebXR Render Loop
    renderer.setAnimationLoop(renderLoop);

    function init() {
      const container = document.getElementById('canvas-container');

      // Create Primary 3D Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010103);
      scene.fog = new THREE.FogExp2(0x010103, 0.15);

      // Setup Perspective Camera (Mosquito POV)
      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.01,
        50
      );

      // Rigid body container for WebXR camera offset & movement
      cameraGroup = new THREE.Group();
      cameraGroup.position.set(0, 1.0, 0.5); // Start hovering near target
      cameraGroup.add(camera);
      scene.add(cameraGroup);

      // WebGL Renderer Setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.xr.enabled = true; // Enable WebXR pipeline
      container.appendChild(renderer.domElement);

      // Mount WebXR Enter Button safely using bundled helper
      document.body.appendChild(CustomVRButton.createButton(renderer));

      // Window Resize Event
      window.addEventListener('resize', onWindowResize);
    }

    // --- THERMAL INFRARED SHADER PIPELINE ---
    function setupThermalPostProcessing() {
      // Create off-screen render buffer
      renderTarget = new THREE.WebGLRenderTarget(
        window.innerWidth * window.devicePixelRatio,
        window.innerHeight * window.devicePixelRatio,
        {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat
        }
      );

      // Custom False-Color Thermal Vision Material
      thermalShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: null },
          time: { value: 0.0 },
          noiseIntensity: { value: 0.03 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float time;
          uniform float noiseIntensity;
          varying vec2 vUv;

          // Pseudo-random generator for sensor noise
          float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
          }

          // Authentic FLIR Ironbow Thermal Palette Ramp
          vec3 computeThermalPalette(float val) {
            val = clamp(val, 0.0, 1.0);
            
            // Standard FLIR Ironbow Keyframes:
            // 0.0: Dark Navy/Black (Cold background)
            // 0.2: Deep Indigo / Violet
            // 0.45: Crimson Magenta / Warm Red
            // 0.70: Bright Flame Orange
            // 0.88: Gold / Electric Yellow
            // 1.0: Pure Blinding White (Heat core)
            vec3 cCold    = vec3(0.01, 0.01, 0.08); // Dark Navy Void
            vec3 cLow     = vec3(0.18, 0.02, 0.45); // Deep Indigo
            vec3 cMid     = vec3(0.72, 0.05, 0.35); // Crimson Magenta
            vec3 cWarm    = vec3(0.95, 0.35, 0.00); // Flame Orange
            vec3 cHot     = vec3(1.00, 0.88, 0.10); // Bright Gold Yellow
            vec3 cExtreme = vec3(1.00, 1.00, 1.00); // White Hot Core

            if (val < 0.20) return mix(cCold, cLow, val / 0.20);
            if (val < 0.45) return mix(cLow, cMid, (val - 0.20) / 0.25);
            if (val < 0.70) return mix(cMid, cWarm, (val - 0.45) / 0.25);
            if (val < 0.88) return mix(cWarm, cHot, (val - 0.70) / 0.18);
            return mix(cHot, cExtreme, (val - 0.88) / 0.12);
          }

          void main() {
            vec4 sceneColor = texture2D(tDiffuse, vUv);
            
            // Normalize brightness to map precisely into FLIR spectrum
            float luminance = dot(sceneColor.rgb, vec3(0.299, 0.587, 0.114));
            luminance = clamp(luminance * 1.25, 0.0, 1.0);

            // Map luminance through the FLIR Ironbow thermal lookup
            vec3 thermalColor = computeThermalPalette(luminance);

            // Thermal IR sensor horizontal scanlines
            float scanline = sin(vUv.y * 360.0 + time * 4.0) * 0.02;
            thermalColor += scanline;

            // Micro sensor digital noise grain
            float n = (random(vUv + time * 0.02) - 0.5) * noiseIntensity;
            thermalColor += n;

            // Compound insect lens vignetting
            float dist = distance(vUv, vec2(0.5));
            thermalColor *= smoothstep(0.75, 0.25, dist);

            gl_FragColor = vec4(thermalColor, 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false
      });

      // Quad overlay setup
      postScene = new THREE.Scene();
      postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), thermalShaderMaterial);
      postScene.add(quad);
    }

    // --- ENVIRONMENT & SCENE BUILDER ---
    function buildMosquitoWorld() {
      // Cold Ambient Lighting
      const ambient = new THREE.AmbientLight(0x020210, 0.4);
      scene.add(ambient);

      // Environment Room Box (Cold Walls)
      const roomGeo = new THREE.BoxGeometry(12, 8, 12);
      const roomMat = new THREE.MeshStandardMaterial({
        color: 0x050515,
        roughness: 0.9,
        side: THREE.BackSide
      });
      const room = new THREE.Mesh(roomGeo, roomMat);
      room.position.y = 3;
      scene.add(room);

      // Spatial Grid Helper
      const grid = new THREE.GridHelper(12, 24, 0x112244, 0x050515);
      grid.position.y = 0.01;
      scene.add(grid);

      // --- TARGET 1: HUMAN ARM ---
      const armGroup = new THREE.Group();
      
      const armGeo = new THREE.CylinderGeometry(0.35, 0.35, 3.5, 32);
      const armMat = new THREE.MeshStandardMaterial({
        color: 0xaa2200,
        emissive: 0x440800,
        emissiveIntensity: 0.5,
        roughness: 0.5
      });
      const armMesh = new THREE.Mesh(armGeo, armMat);
      armMesh.rotation.z = Math.PI / 2.5;
      armGroup.add(armMesh);

      // --- TARGET 2: HOT BLOOD VESSELS ---
      const vesselPositions = [
        new THREE.Vector3(-0.5, 0.0, 0.1),
        new THREE.Vector3(0.2, 0.1, -0.1),
        new THREE.Vector3(0.8, -0.05, 0.05)
      ];

      vesselPositions.forEach((pos, idx) => {
        // Hot vessel sphere core
        const coreGeo = new THREE.SphereGeometry(0.04, 16, 16);
        const coreMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: 0xffffff,
          emissiveIntensity: 1.0
        });
        const vesselCore = new THREE.Mesh(coreGeo, coreMat);
        vesselCore.position.copy(pos);
        armGroup.add(vesselCore);

        // Heat light emitter
        const heatLight = new THREE.PointLight(0xff8800, 1.2, 0.5);
        heatLight.position.copy(pos);
        armGroup.add(heatLight);

        targetVessels.push({
          mesh: vesselCore,
          light: heatLight,
          basePos: pos.clone().add(new THREE.Vector3(0, 1.1, -1.0)),
          id: idx
        });
      });

      armGroup.position.set(0, 1.1, -1.0);
      scene.add(armGroup);

      createCO2Particles();
    }

    function createCO2Particles() {
      const particleCount = 150;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 4;
        positions[i + 1] = Math.random() * 3;
        positions[i + 2] = (Math.random() - 0.5) * 4 - 0.5;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const mat = new THREE.PointsMaterial({
        color: 0xff4411,
        size: 0.02,
        transparent: true,
        opacity: 0.5
      });

      const particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    // --- CONTROLLERS & FLIGHT MECHANICS ---
    function setupVRControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        
        const rayGeo = new THREE.CylinderGeometry(0.001, 0.003, 0.3);
        rayGeo.rotateX(-Math.PI / 2);
        const rayMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const proboscisPointer = new THREE.Mesh(rayGeo, rayMat);
        proboscisPointer.position.z = -0.15;
        controller.add(proboscisPointer);

        cameraGroup.add(controller);
        controllers.push(controller);
      }
    }

    const keyState = {};
    function setupKeyboardFallback() {
      window.addEventListener('keydown', (e) => keyState[e.code] = true);
      window.addEventListener('keyup', (e) => keyState[e.code] = false);
    }

    function processInput(delta) {
      const session = renderer.xr.getSession();
      if (session) {
        for (const source of session.inputSources) {
          if (source.gamepad) {
            const axes = source.gamepad.axes;
            if (axes.length >= 4) {
              const moveX = axes[2] || axes[0] || 0;
              const moveZ = axes[3] || axes[1] || 0;

              if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                side.y = 0; side.normalize();

                playerVelocity.addScaledVector(side, moveX * flightSpeed * delta);
                playerVelocity.addScaledVector(forward, -moveZ * flightSpeed * delta);
              }
            }
          }
        }
      }

      if (keyState['KeyW']) {
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        playerVelocity.addScaledVector(dir, flightSpeed * delta);
      }
      if (keyState['KeyS']) {
        const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion);
        playerVelocity.addScaledVector(dir, flightSpeed * delta);
      }
      if (keyState['KeyA']) {
        const dir = new THREE.Vector3(-1, 0, 0).applyQuaternion(camera.quaternion);
        playerVelocity.addScaledVector(dir, flightSpeed * delta);
      }
      if (keyState['KeyD']) {
        const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        playerVelocity.addScaledVector(dir, flightSpeed * delta);
      }
      if (keyState['Space']) {
        playerVelocity.y += flightSpeed * delta;
      }
      if (keyState['ShiftLeft']) {
        playerVelocity.y -= flightSpeed * delta;
      }

      cameraGroup.position.add(playerVelocity);
      playerVelocity.multiplyScalar(drag);
    }

    // --- HEAT PROXIMITY SENSING LOGIC ---
    function updateHeatSensing() {
      let maxHeatProximity = 0;
      const playerPos = cameraGroup.position;

      targetVessels.forEach(vessel => {
        const dist = playerPos.distanceTo(vessel.basePos);
        const heatFactor = Math.max(0, 1.0 - (dist / 2.0));
        if (heatFactor > maxHeatProximity) {
          maxHeatProximity = heatFactor;
        }
      });

      const percentage = Math.round(maxHeatProximity * 100);
      if (heatSenseText) {
        heatSenseText.innerText = `${percentage}%`;
        heatSenseText.style.color = `rgb(255, ${255 - percentage * 2.5}, ${255 - percentage * 2.5})`;
      }
    }

    // --- MAIN RENDER LOOP ---
    function renderLoop() {
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      processInput(delta);
      updateHeatSensing();

      targetVessels.forEach((vessel, i) => {
        const pulse = 1.0 + Math.sin(elapsedTime * 5.0 + i) * 0.25;
        vessel.mesh.scale.set(pulse, pulse, pulse);
        vessel.light.intensity = 1.0 + Math.sin(elapsedTime * 5.0 + i) * 0.5;
      });

      thermalShaderMaterial.uniforms.time.value = elapsedTime;

      // Pass 1: Render scene to offscreen buffer
      renderer.setRenderTarget(renderTarget);
      renderer.render(scene, camera);

      // Pass 2: Process post shader quad
      thermalShaderMaterial.uniforms.tDiffuse.value = renderTarget.texture;
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCamera);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderTarget.setSize(width * window.devicePixelRatio, height * window.devicePixelRatio);
    }
  </script>
</body>
</html>
