<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosquito VR Thermal Vision Experience</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* HUD Overlay Info */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffaa;
      font-family: monospace;
      text-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
      pointer-events: none;
      z-index: 10;
      background: rgba(0, 15, 10, 0.6);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 170, 0.3);
      max-width: 320px;
    }
    #ui-overlay h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }
    #ui-overlay p {
      font-size: 0.8rem;
      color: #88ccbb;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .hud-stat {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .hud-label {
      color: #66aaaa;
    }
    .hud-value {
      font-weight: bold;
      color: #ffcc00;
    }

    /* VR BUTTON OVERRIDE STYLING */
    #VRButton {
      position: absolute !important;
      bottom: 25px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      padding: 12px 24px !important;
      border: 2px solid #00ffaa !important;
      border-radius: 30px !important;
      background: rgba(0, 30, 20, 0.85) !important;
      color: #00ffaa !important;
      font-family: monospace !important;
      font-size: 14px !important;
      font-weight: bold !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.4) !important;
      transition: all 0.2s ease !important;
      z-index: 1000 !important;
    }
    #VRButton:hover {
      background: #00ffaa !important;
      color: #000000 !important;
      box-shadow: 0 0 25px rgba(0, 255, 170, 0.8) !important;
    }
  </style>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Overlay Info -->
  <div id="ui-overlay">
    <h1>Mosquito Vision VR</h1>
    <p>Real-time camera thermal vision simulation. Enable camera access to view your surrounding environment in mosquito heat vision.</p>
    <div class="hud-stat">
      <span class="hud-label">Vision Mode:</span>
      <span class="hud-value" id="vision-mode-text">Thermal Infrared (FLIR)</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Camera Status:</span>
      <span class="hud-value" id="camera-status-text">Requesting Video...</span>
    </div>
    <div class="hud-stat" style="margin-top: 10px; pointer-events: auto;">
      <button id="toggle-camera-btn" style="background: rgba(0,255,170,0.2); border: 1px solid #00ffaa; color: #00ffaa; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: monospace;">Switch Camera</button>
    </div>
  </div>

  <script>
    /**
     * THREE.JS MOSQUITO REAL-TIME CAMERA THERMAL VISION ENGINE
     */
    let scene, camera, renderer, cameraGroup;
    let videoElement, videoTexture;
    let postScene, postCamera, thermalShaderMaterial;
    let clock = new THREE.Clock();
    let currentFacingMode = 'environment'; // 'user' or 'environment'
    let mediaStream = null;

    // Element References
    const cameraStatusText = document.getElementById('camera-status-text');
    const toggleCamBtn = document.getElementById('toggle-camera-btn');

    // --- INITIALIZATION ---
    init();
    initVideoFeed();
    setupThermalPostProcessing();
    setupToggleCamera();

    // Start Render Loop
    renderer.setAnimationLoop(renderLoop);

    function init() {
      const container = document.getElementById('canvas-container');

      // Create Primary 3D Scene
      scene = new THREE.Scene();

      // Setup Camera
      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.01,
        50
      );

      cameraGroup = new THREE.Group();
      cameraGroup.add(camera);
      scene.add(cameraGroup);

      // WebGL Renderer Setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);
    }

    // --- REAL-TIME CAMERA VIDEO FEED SETUP ---
    function initVideoFeed() {
      // Create hidden video element to capture WebCam feed
      videoElement = document.createElement('video');
      videoElement.autoplay = true;
      videoElement.muted = true;
      videoElement.playsInline = true;

      // Wrap video in Three.js VideoTexture
      videoTexture = new THREE.VideoTexture(videoElement);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;

      startCameraStream(currentFacingMode);
    }

    async function startCameraStream(facingMode) {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      cameraStatusText.innerText = 'Connecting...';
      cameraStatusText.style.color = '#ffcc00';

      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = mediaStream;
        await videoElement.play();
        
        cameraStatusText.innerText = 'LIVE (' + facingMode.toUpperCase() + ')';
        cameraStatusText.style.color = '#00ffaa';
      } catch (err) {
        console.error('Camera access error:', err);
        cameraStatusText.innerText = 'Access Denied / Unavailable';
        cameraStatusText.style.color = '#ff4444';
      }
    }

    function setupToggleCamera() {
      if (toggleCamBtn) {
        toggleCamBtn.addEventListener('click', () => {
          currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
          startCameraStream(currentFacingMode);
        });
      }
    }

    // --- THERMAL INFRARED SHADER PIPELINE (REAL-TIME CAMERA PROCESSED) ---
    function setupThermalPostProcessing() {
      // Custom Thermal Shader converting camera live texture to FLIR Ironbow spectrum
      thermalShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          tCamera: { value: videoTexture },
          time: { value: 0.0 },
          noiseIntensity: { value: 0.035 },
          contrastBoost: { value: 1.35 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tCamera;
          uniform float time;
          uniform float noiseIntensity;
          uniform float contrastBoost;
          varying vec2 vUv;

          // Pseudo-random noise generator for sensor artifacts
          float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
          }

          // Authentic FLIR Ironbow Thermal Palette Ramp Mapping
          vec3 computeThermalPalette(float val) {
            val = clamp(val, 0.0, 1.0);
            
            // FLIR Ironbow Keyframe Spectrum mapping ambient light/contrast to heat gradient
            vec3 cCold    = vec3(0.01, 0.01, 0.08); // Dark Navy / Cold ambient
            vec3 cLow     = vec3(0.18, 0.02, 0.45); // Deep Indigo
            vec3 cMid     = vec3(0.72, 0.05, 0.35); // Crimson Magenta
            vec3 cWarm    = vec3(0.95, 0.35, 0.00); // Flame Orange
            vec3 cHot     = vec3(1.00, 0.88, 0.10); // Bright Gold Yellow
            vec3 cExtreme = vec3(1.00, 1.00, 1.00); // White Hot Core

            if (val < 0.20) return mix(cCold, cLow, val / 0.20);
            if (val < 0.45) return mix(cLow, cMid, (val - 0.20) / 0.25);
            if (val < 0.70) return mix(cMid, cWarm, (val - 0.45) / 0.25);
            if (val < 0.88) return mix(cWarm, cHot, (val - 0.70) / 0.18);
            return mix(cHot, cExtreme, (val - 0.88) / 0.12);
          }

          void main() {
            // Sample real-time camera feed
            vec4 camColor = texture2D(tCamera, vUv);
            
            // Calculate luminance & edge contrast to simulate heat radiation
            float luminance = dot(camColor.rgb, vec3(0.299, 0.587, 0.114));
            luminance = clamp(pow(luminance, 0.85) * contrastBoost, 0.0, 1.0);

            // Compute thermal spectrum map
            vec3 thermalColor = computeThermalPalette(luminance);

            // Digital IR thermal scanlines
            float scanline = sin(vUv.y * 420.0 + time * 5.0) * 0.02;
            thermalColor += scanline;

            // Micro IR sensor noise
            float n = (random(vUv + time * 0.03) - 0.5) * noiseIntensity;
            thermalColor += n;

            // Insect compound eye / thermal lens vignetting
            float dist = distance(vUv, vec2(0.5));
            thermalColor *= smoothstep(0.78, 0.2, dist);

            gl_FragColor = vec4(thermalColor, 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false
      });

      // Fullscreen quad for output display
      postScene = new THREE.Scene();
      postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), thermalShaderMaterial);
      postScene.add(quad);
    }

    // --- MAIN RENDER LOOP ---
    function renderLoop() {
      const elapsedTime = clock.getElapsedTime();

      // Update shader uniforms
      thermalShaderMaterial.uniforms.time.value = elapsedTime;

      // Render video thermal pass to screen
      renderer.setRenderTarget(null);
      renderer.render(postScene, postCamera);
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
    }
  </script>
</body>
</html>
