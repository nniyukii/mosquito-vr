<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosquito VR Thermal Vision Experience</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* HUD Overlay Info */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffaa;
      font-family: monospace;
      text-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
      pointer-events: none;
      z-index: 10;
      background: rgba(0, 15, 10, 0.65);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 170, 0.3);
      max-width: 320px;
    }
    #ui-overlay h1 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }
    #ui-overlay p {
      font-size: 0.8rem;
      color: #88ccbb;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .hud-stat {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .hud-label {
      color: #66aaaa;
    }
    .hud-value {
      font-weight: bold;
      color: #ffcc00;
    }

    /* VR BUTTON STYLING */
    #VRButton {
      position: absolute !important;
      bottom: 25px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      padding: 14px 28px !important;
      border: 2px solid #00ffaa !important;
      border-radius: 30px !important;
      background: rgba(0, 30, 20, 0.9) !important;
      color: #00ffaa !important;
      font-family: monospace !important;
      font-size: 14px !important;
      font-weight: bold !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.5) !important;
      transition: all 0.2s ease !important;
      z-index: 1000 !important;
      cursor: pointer;
    }
    #VRButton:hover {
      background: #00ffaa !important;
      color: #000000 !important;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.9) !important;
    }
  </style>
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Overlay Info -->
  <div id="ui-overlay">
    <h1>Mosquito Thermal VR</h1>
    <p>Meta Quest 2 Real-Time Passthrough Thermal Vision.</p>
    <div class="hud-stat">
      <span class="hud-label">Palette:</span>
      <span class="hud-value" id="vision-mode-text">FLIR Ironbow IR</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Status:</span>
      <span class="hud-value" id="camera-status-text">Checking WebXR...</span>
    </div>
  </div>

  <script>
    /**
     * THREE.JS MOSQUITO WEBXR THERMAL PASSTHROUGH ENGINE
     * Optimized for Meta Quest 2 Oculus Browser
     */
    let scene, camera, renderer, cameraGroup;
    let postScene, postCamera, thermalShaderMaterial, renderTarget;
    let clock = new THREE.Clock();

    const cameraStatusText = document.getElementById('camera-status-text');

    init();
    setupThermalPostProcessing();
    setupQuestVRButton();

    renderer.setAnimationLoop(renderLoop);

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.01,
        50
      );

      cameraGroup = new THREE.Group();
      cameraGroup.position.set(0, 1.2, 0);
      cameraGroup.add(camera);
      scene.add(cameraGroup);

      // WebGL Renderer Setup (Alpha enabled for WebXR Passthrough)
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0.0);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);
    }

    // --- THERMAL INFRARED SHADER PIPELINE ---
    function setupThermalPostProcessing() {
      renderTarget = new THREE.WebGLRenderTarget(
        window.innerWidth,
        window.innerHeight
      );

      thermalShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: null },
          time: { value: 0.0 },
          noiseIntensity: { value: 0.04 },
          contrastBoost: { value: 1.5 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float time;
          uniform float noiseIntensity;
          uniform float contrastBoost;
          varying vec2 vUv;

          float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
          }

          // Authentic FLIR Ironbow Thermal Spectrum
          vec3 computeThermalPalette(float val) {
            val = clamp(val, 0.0, 1.0);
            vec3 cCold    = vec3(0.02, 0.01, 0.12); // Deep Indigo Background
            vec3 cLow     = vec3(0.20, 0.02, 0.50); // Violet
            vec3 cMid     = vec3(0.75, 0.05, 0.35); // Crimson Magenta
            vec3 cWarm    = vec3(0.98, 0.38, 0.00); // Amber Orange
            vec3 cHot     = vec3(1.00, 0.90, 0.10); // Gold Yellow
            vec3 cExtreme = vec3(1.00, 1.00, 1.00); // White Hot Core

            if (val < 0.20) return mix(cCold, cLow, val / 0.20);
            if (val < 0.45) return mix(cLow, cMid, (val - 0.20) / 0.25);
            if (val < 0.70) return mix(cMid, cWarm, (val - 0.45) / 0.25);
            if (val < 0.88) return mix(cWarm, cHot, (val - 0.70) / 0.18);
            return mix(cHot, cExtreme, (val - 0.88) / 0.12);
          }

          void main() {
            vec4 sceneColor = texture2D(tDiffuse, vUv);
            
            // Generate dynamic luminance pattern for thermal simulation
            float luminance = dot(sceneColor.rgb, vec3(0.299, 0.587, 0.114));
            
            // Add subtle animated thermal gradient wave across view
            float thermalWave = sin(vUv.y * 3.0 + time * 0.5) * 0.15 + 0.45;
            luminance = clamp(mix(luminance, thermalWave, 0.4) * contrastBoost, 0.0, 1.0);

            vec3 thermalColor = computeThermalPalette(luminance);

            // Insect CRT scanline matrix
            float scanline = sin(vUv.y * 420.0 + time * 4.0) * 0.03;
            thermalColor += scanline;

            // Sensor noise grain
            float n = (random(vUv + time * 0.02) - 0.5) * noiseIntensity;
            thermalColor += n;

            // Mosquito lens vignetting
            float dist = distance(vUv, vec2(0.5));
            thermalColor *= smoothstep(0.82, 0.15, dist);

            gl_FragColor = vec4(thermalColor, 0.88);
          }
        `,
        depthTest: false,
        depthWrite: false,
        transparent: true
      });

      postScene = new THREE.Scene();
      postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), thermalShaderMaterial);
      postScene.add(quad);
    }

    // --- META QUEST 2 PASSTHROUGH WEBXR BUTTON ---
    function setupQuestVRButton() {
      const button = document.createElement('button');
      button.id = 'VRButton';
      button.textContent = 'ENTER PASSTHROUGH VR';

      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            cameraStatusText.innerText = 'Passthrough Ready (immersive-ar)';
            cameraStatusText.style.color = '#00ffaa';
            button.addEventListener('click', onEnterAR);
          } else {
            navigator.xr.isSessionSupported('immersive-vr').then((vrSupported) => {
              if (vrSupported) {
                button.textContent = 'ENTER VR MODE';
                button.addEventListener('click', onEnterVR);
                cameraStatusText.innerText = 'VR Mode Ready';
              } else {
                button.textContent = 'WEBXR NOT SUPPORTED';
                button.disabled = true;
                cameraStatusText.innerText = 'WebXR Unsupported';
              }
            });
          }
        });
      } else {
        button.textContent = 'OPEN IN QUEST BROWSER';
        cameraStatusText.innerText = 'Requires Oculus Browser';
      }

      document.body.appendChild(button);
    }

    async function onEnterAR() {
      const sessionInit = { requiredFeatures: [], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.body } };
      try {
        const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
        renderer.xr.setReferenceSpaceType('local');
        await renderer.xr.setSession(session);
      } catch (e) {
        console.warn('AR Request failed, falling back to VR mode', e);
        onEnterVR();
      }
    }

    async function onEnterVR() {
      const session = await navigator.xr.requestSession('immersive-vr');
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
    }

    // --- MAIN RENDER LOOP ---
    function renderLoop() {
      const elapsedTime = clock.getElapsedTime();
      thermalShaderMaterial.uniforms.time.value = elapsedTime;

      if (renderer.xr.isPresenting) {
        renderer.render(scene, camera);
      } else {
        renderer.setRenderTarget(renderTarget);
        renderer.render(scene, camera);

        thermalShaderMaterial.uniforms.tDiffuse.value = renderTarget.texture;
        renderer.setRenderTarget(null);
        renderer.render(postScene, postCamera);
      }
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderTarget.setSize(width, height);
    }
  </script>
</body>
</html>
